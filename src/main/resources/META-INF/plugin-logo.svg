<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B2FFF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- background rounded rect -->
  <rect x="1" y="1" width="38" height="38" rx="8" fill="url(#bg)"/>
  <!-- shine overlay -->
  <rect x="1" y="1" width="38" height="19" rx="8" fill="url(#shine)"/>
  <!-- code lines -->
  <rect x="8"  y="12" width="14" height="3" rx="1.5" fill="white"/>
  <rect x="8"  y="18" width="20" height="3" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="8"  y="24" width="10" height="3" rx="1.5" fill="white" opacity="0.65"/>
  <!-- arrow / chevron -->
  <polyline points="26,14 32,20 26,26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
